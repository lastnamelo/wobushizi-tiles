<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tiles is a local-first tool for creating Chinese teaching tile graphics."
    />
    <title>Tiles - Chinese Teaching Graphics</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">wobushizi classroom tool</p>
          <h1>tiles</h1>
        </div>
      </header>

      <section class="page page-input" id="inputPage" aria-label="Paste text">
        <div class="panel input-panel">
          <textarea
            id="sourceText"
            aria-label="Chinese text"
            spellcheck="false"
            autocomplete="off"
            rows="8"
          >老师中文版准备上课</textarea>

          <div class="button-row">
            <button type="button" id="clearInput">Clear</button>
            <button type="button" id="makeSentence">Make sentence</button>
            <button type="button" class="primary-button" id="makeTiles">Make tiles</button>
          </div>
          <p class="status" id="inputStatus" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section class="page page-tiles is-hidden" id="tilesPage" aria-label="Rendered tiles">
        <div class="palette-strip" id="paletteStrip" aria-label="Tile color key"></div>
        <section class="preview-panel" aria-label="Rendered tile preview">
          <div class="preview-surface" id="captureSurface">
            <div class="sentence-meaning-bar is-hidden" id="sentenceMeaningBar">
              <input
                id="sentenceMeaning"
                aria-label="English meaning"
                autocomplete="off"
                placeholder="English meaning"
                type="text"
              />
            </div>
            <div class="tile-board" id="tileBoard"></div>
            <div class="sentence-board is-hidden" id="sentenceBoard"></div>
          </div>
        </section>
        <div class="bottom-actions">
          <button type="button" class="sentence-action is-hidden" id="copySentencePng">
            Copy sentence as PNG
          </button>
          <button type="button" id="copyAllSvg">Copy all as SVG</button>
          <button type="button" class="primary-button" id="editText">Back to input</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
